<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查看成绩详情 · 普通用户流程</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#202428;font:14px/1.6 'Microsoft YaHei','PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,select:focus-visible{outline:3px solid #447cc0;outline-offset:2px}h1,h2,h3,p{margin:0}.design-header{max-width:1280px;margin:auto;padding:30px 26px 24px;display:flex;align-items:center;justify-content:space-between}.design-header small{color:#7a858e;letter-spacing:1px}.design-header h1{font-size:27px;margin:5px 0}.design-header p,.design-header>span{color:#71808c;font-size:12px}.screens{max-width:1280px;margin:auto;padding:0 26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.caption b{font-size:14px}.caption span{font-size:11px;color:#7c858c}.phone{height:848px;background:white;border:6px solid white;border-radius:27px;overflow:hidden;position:relative;box-shadow:0 10px 32px #22334412;display:flex;flex-direction:column}.status{height:28px;background:#f39800;color:white;display:flex;align-items:center;justify-content:space-between;padding:5px 16px;font:12px Arial}.nav{background:#f39800;color:white;min-height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 13px}.nav>span{font-size:16px}.nav button{width:35px;text-align:left;color:white;min-height:40px;font-size:29px;padding:0}.capsule{border:1px solid #ffffff77;border-radius:20px;font-size:15px;padding:1px 10px;letter-spacing:2px}.page{overflow-y:auto;flex:1;scrollbar-width:none;padding:19px 17px 30px;overscroll-behavior:contain}.page h2{font-size:18px;font-weight:500;line-height:1.65}.meta{display:flex;justify-content:space-between;font-size:11px;color:#969ca1;margin:17px 0}.notice{width:100%;padding:10px 12px;background:#fff9ec;color:#ef9600;text-align:left;font-size:13px;margin-bottom:20px}.notice span{float:right}.section-title{border-left:3px solid #f39800;font-size:17px;font-weight:400;padding-left:9px;margin:0 0 14px;line-height:1.4}.registration p{font-size:13px;margin:9px 0}.actions{display:flex;gap:16px;margin:17px 0 25px}.primary,.secondary{border-radius:24px;min-height:42px;padding:8px 10px;flex:1;font-size:13px;white-space:nowrap}.primary{background:#f39800;color:white}.secondary{border:1px solid #f39800;color:#f39800}.facts{display:grid;grid-template-columns:64px 1fr;gap:7px;font-size:12px;color:#5b6269}.facts dt{color:#8e949a}.facts dd{margin:0}.home-line{height:4px;width:100px;background:#202428;border-radius:3px;position:absolute;bottom:5px;left:calc(50% - 50px);z-index:15}.overlay{position:absolute;inset:77px 0 0;background:#000a;z-index:10;display:flex;align-items:flex-end}.sheet{height:84%;width:100%;background:white;border-radius:13px 13px 0 0;display:flex;flex-direction:column;overflow:hidden}.sheet-header{min-height:55px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;position:relative;font-size:18px}.sheet-header button{position:absolute;right:10px;font-size:24px;color:#858585;width:40px;height:44px;font-weight:300}.group-list{overflow-y:auto;overscroll-behavior:contain;padding:21px 10px 28px;scrollbar-width:thin;scrollbar-color:#d6d6d6 transparent}.group-section{margin-bottom:26px}.group-section:last-child{margin-bottom:0}.group-name{border-left:3px solid #f39800;padding-left:12px;font-size:17px;font-weight:400;line-height:1.4;margin-bottom:12px}.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding-left:10px}.stage-grid button{color:#ed9300;min-height:43px;font-size:16px;font-weight:400}.stage-grid button:hover{background:#fff8ec}.result-page{position:absolute;inset:28px 0 0;background:white;z-index:16;display:flex;flex-direction:column}.result-nav{min-height:49px;background:#f39800;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.result-nav button{font-size:25px;width:37px;text-align:left;color:white}.result-nav span{font-size:16px}.result-nav i{width:37px}.result-scroll{flex:1;overflow:auto;padding:20px 15px 35px;scrollbar-width:thin}.result-scroll h2{font-size:21px;font-weight:500;margin-bottom:2px}.subtitle{font-size:11px;color:#8c969e;margin-bottom:20px}.filters{display:flex;gap:10px;margin:16px 0}.filters label{font-size:11px;color:#89939a;flex:1;min-width:0}.filters select{display:block;width:100%;background:#fff;border:1px solid #e1e5e8;border-radius:5px;padding:9px 5px;color:#353c42;font-size:13px;margin-top:5px}.table-wrap{overflow-x:auto;border:1px solid #e8ebee;border-radius:4px}table{width:100%;border-collapse:collapse;min-width:340px;font-size:12px}th{font-weight:400;color:#7c868d;background:#f7f8fa;padding:12px 8px;white-space:nowrap}td{padding:20px 10px}.empty{padding:65px 15px;text-align:center}.empty svg{width:46px;height:46px;stroke:#b8c1c8;margin-bottom:14px}.empty strong{display:block;font-size:15px;font-weight:400;color:#657480}.empty p{font-size:12px;color:#9ba4ab;margin-top:8px;line-height:1.8}.explain{color:#8d979f;font-size:11px;margin-top:15px;line-height:1.8}.back-list{width:100%;border:1px solid #f39800;color:#f39800;border-radius:5px;min-height:43px;font-size:13px;margin-top:20px}footer{max-width:1280px;margin:auto;padding:22px 26px 30px;color:#7f8a93;font-size:11px}.popup-note{position:absolute;z-index:30;bottom:40px;left:20px;right:20px;background:#293540e8;color:white;padding:14px;border-radius:8px;text-align:center;font-size:12px}@media(max-width:1050px){.screens{grid-template-columns:repeat(3,360px);overflow-x:auto;padding-bottom:20px;scroll-snap-type:x mandatory}.screens article{scroll-snap-align:center}.design-header{align-items:flex-start;gap:20px}}@media(max-width:600px){.design-header{display:block;padding:20px 16px}.design-header>span{display:block;margin-top:8px}.screens{display:block;padding:0 12px;overflow:visible}.screens article{max-width:410px;margin:0 auto 24px}.phone{height:830px}.caption span{font-size:10px}.design-header h1{font-size:24px}footer{padding:0 18px 25px}.registration p{font-size:12px}.actions{gap:10px}.primary,.secondary{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.group-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.group-heading .group-name{margin-bottom:0}.expand-group{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px}.expand-group:hover{background:#fff8ec}.chevron{width:10px;height:10px;border-right:2px solid #ed9300;border-bottom:2px solid #ed9300;transform:rotate(45deg);margin-top:-5px}.expanded .chevron{transform:rotate(225deg);margin-top:5px}.group-section:not(.expanded) .stage-hidden{display:none}
</style></head><body><header class="design-header"><div><small>赛事详情 / 普通用户查看流程</small><h1>查看成绩详情</h1><p>保持原详情页布局，按表格组别打开 SS1–SS9 与总成绩。</p></div><span>交互设计稿 · 未连接真实成绩</span></header><main class="screens"><article><div class="caption"><b>1　赛事详情</b><span>点击橙色按钮</span></div><div class="phone" id="entry"></div></article><article><div class="caption"><b>2　选择组别与赛段</b><span>点击组名右侧箭头展开</span></div><div class="phone" id="groups"></div></article><article><div class="caption"><b>3　查看对应成绩</b><span>普通用户只读</span></div><div class="phone" id="result"></div></article></main><footer>组别名称来自《拉力赛成统计时表格模板（SS1-9）》报名表 H1:S1。每组 10 个入口，共 120 个，默认显示前三个，点击箭头展开全部。</footer><script>const GROUPS=["四驱组", "N4组", "两驱组", "1.6组", "POLO杯", "新人组", "“王者归来”组", "巾帼杯", "四驱俱乐部杯", "两驱俱乐部杯", "厂商杯", "飞车王"];
const STAGES=["SS1", "SS2", "SS3", "SS4", "SS5", "SS6", "SS7", "SS8", "SS9", "总成绩"];</script><script>const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sectionNames=['集结赛公开A组','集结赛公开B组','集结赛公开C组','集结赛公开D组','场地赛专业组','场地赛公开组','场地赛UTV组','场地赛新秀组','场地赛女子组','攀爬赛改装组','攀爬赛量产组'];
function detail(id){document.getElementById(id).innerHTML=`<div class="status"><span>9:41</span><span>▂▃▅　▱</span></div><div class="nav"><button data-action="return" aria-label="返回">‹</button><span>赛事详情</span><div class="capsule">••• │ ⊙</div></div><div class="page"><h2>2026中国·遂平嵖岈山首届汽车越野嘉年华《赛事预报》</h2><div class="meta"><span>◷ 2026-07-17　◉ 3884</span><span>已完赛</span></div><button class="notice" data-action="notice">该赛事有1条公告（点击查看）<span>›</span></button><h3 class="section-title">赛事报名</h3><div class="registration">${sectionNames.map((n,i)=>`<p>${n} ￥1/${i<4?'辆':'人'}（已报0${i<4?'辆':'人'}）</p>`).join('')}</div><div class="actions"><button class="primary" data-action="open">查看成绩详情</button><button class="secondary" data-action="roster">查看报名列表</button></div><h3 class="section-title">赛事信息</h3><dl class="facts"><dt>比赛时间</dt><dd>2026-08-23 ～ 2026-08-30</dd><dt>报名截止</dt><dd>2026-08-22</dd><dt>集合地址</dt><dd>河南省·驻马店市·遂平县<br>（报到地点待定）</dd><dt>联系人</dt><dd>马银鹏</dd></dl></div><div class="home-line"></div>`}
function openGroups(phone){phone.querySelector('.result-page')?.remove();phone.querySelector('.overlay')?.remove();phone.insertAdjacentHTML('beforeend',`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="成绩详情"><div class="sheet-header">成绩详情<button data-action="close" aria-label="关闭成绩详情">×</button></div><div class="group-list">${GROUPS.map((g,gi)=>`<section class="group-section"><div class="group-heading"><h3 class="group-name">${escapeHtml(g)}</h3><button class="expand-group" data-action="toggle-group" data-group="${gi}" aria-expanded="false" aria-label="展开${escapeHtml(g)}全部赛段"><span class="chevron" aria-hidden="true"></span></button></div><div class="stage-grid">${STAGES.map((s,si)=>`<button class="${si>=3?'stage-hidden':''}" data-action="score" data-group="${gi}" data-stage="${si}">${escapeHtml(s)}</button>`).join('')}</div></section>`).join('')}</div></section></div>`)}
function openScore(phone,gi,si){phone.querySelector('.overlay')?.setAttribute('aria-hidden','true');phone.querySelector('.result-page')?.remove();phone.dataset.group=gi;phone.dataset.stage=si;const total=STAGES[si]==='总成绩';phone.insertAdjacentHTML('beforeend',`<section class="result-page"><div class="result-nav"><button data-action="back-groups" aria-label="返回组别列表">‹</button><span>${total?'总成绩':escapeHtml(STAGES[si])+' 成绩'}</span><i></i></div><div class="result-scroll"><h2>${escapeHtml(GROUPS[gi])}</h2><p class="subtitle">嵖岈山首届汽车越野嘉年华</p><div class="filters"><label>组别<select data-filter="group" aria-label="切换组别">${GROUPS.map((g,i)=>`<option value="${i}" ${i===gi?'selected':''}>${escapeHtml(g)}</option>`).join('')}</select></label><label>赛段<select data-filter="stage" aria-label="切换赛段">${STAGES.map((s,i)=>`<option value="${i}" ${i===si?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="table-wrap"><table><thead><tr>${['名次','车号','车手 / 领航员',total?'总用时':'赛段用时','罚时'].map(h=>`<th>${h}</th>`).join('')}</tr></thead></table><div class="empty"><svg viewBox="0 0 48 48" fill="none" stroke-width="1.5"><rect x="11" y="8" width="26" height="33" rx="3"/><path d="M18 17h12M18 24h12M18 31h7"/></svg><strong>暂无已发布成绩</strong><p>${escapeHtml(GROUPS[gi])} · ${escapeHtml(STAGES[si])}<br>赛事管理员发布后可在这里查看</p></div></div><p class="explain">只展示已发布记录；未发布或缺失的成绩不按 0 用时参与排名。</p><button class="back-list" data-action="back-groups">返回组别与赛段列表</button></div><div class="home-line"></div></section>`)}
['entry','groups','result'].forEach(detail);openGroups(document.getElementById('groups'));openGroups(document.getElementById('result'));openScore(document.getElementById('result'),0,0);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const p=b.closest('.phone');if(!p)return;switch(b.dataset.action){case'open':openGroups(p);break;case'close':p.querySelector('.overlay')?.remove();break;case'toggle-group':{const section=b.closest('.group-section');const expanded=section.classList.toggle('expanded');b.setAttribute('aria-expanded',String(expanded));b.setAttribute('aria-label',`${expanded?'收起':'展开'}${GROUPS[Number(b.dataset.group)]}全部赛段`);break}case'score':openScore(p,Number(b.dataset.group),Number(b.dataset.stage));break;case'back-groups':p.querySelector('.result-page')?.remove();if(!p.querySelector('.overlay'))openGroups(p);p.querySelector('.overlay').removeAttribute('aria-hidden');break;default:p.querySelector('.popup-note')?.remove();p.insertAdjacentHTML('beforeend',`<div class="popup-note">${b.dataset.action==='roster'?'报名列表沿用现有入口':b.dataset.action==='notice'?'赛事公告沿用现有入口':'此处为赛事详情设计预览'}</div>`);setTimeout(()=>p.querySelector('.popup-note')?.remove(),1800)}});
document.addEventListener('change',e=>{if(!e.target.dataset.filter)return;const p=e.target.closest('.phone');openScore(p,e.target.dataset.filter==='group'?Number(e.target.value):Number(p.dataset.group),e.target.dataset.filter==='stage'?Number(e.target.value):Number(p.dataset.stage))});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const p=e.target.closest('.phone');if(p?.querySelector('.result-page')){p.querySelector('.result-page').remove();p.querySelector('.overlay')?.removeAttribute('aria-hidden')}else p?.querySelector('.overlay')?.remove()});
</script></body></html>
