let phase='live';
const states=Object.fromEntries(Object.keys(roles).map(r=>[r,{tab:r==='user'?'intro':'work',filter:'总榜',saved:false,published:false,reviewed:false,revoked:false,likes:0}]));
function el(r){return document.getElementById('phone-'+r)}
function btn(action,label,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
const status=()=>phase==='live'?'<span class="status">比赛进行中</span>':'<span class="status ended">已完赛</span>';
function entry(r){return `<div class="context">${r==='user'?btn('my',`<span class="bib">026</span><span class="entry-text"><strong>我的参赛 · 公开 A 组</strong><small>${phase==='live'?'已完成 3 / 9 赛段 · 查看已发布成绩':'赛事已结束 · 查看已发布成绩'}</small></span>${icon('chevron-right')}`,'entry-card'):btn('work',`${icon(r==='staff'?'clipboard-check':r==='owner'?'shield-check':'settings-2')}<span class="entry-text"><strong>${r==='staff'?'我的现场任务':r==='owner'?'本场人员与权限':'本场赛事管理'}</strong><small>${r==='staff'?(phase==='live'?'SS1 / SS2 · 终点计时录入':'任务已结束 · 历史记录可查'):r==='owner'?'3 名协作人员 · 权限由你分配':'2 项待复核 · 1 份成绩待发布'}</small></span>${icon('chevron-right')}`,'entry-card '+(r==='staff'?'work':'manage'))}${r!=='user'?`<div class="personal-link"><span>个人参赛：026 号车组</span>${btn('my','查看我的成绩 ›')}</div>`:''}</div>`}
function nav(r){return `<div class="tabs">${[['intro','介绍'],['registration','报名'],['results','成绩'],...(r==='user'?[]:[['work',r==='staff'?'工作台':'赛事管理']])].map(([a,t])=>btn('tab',t,states[r].tab===a?'active':'',`data-tab="${a}"`)).join('')}</div>`}
function render(r,keep=false){const old=el(r),scroll=old?.querySelector('.viewport')?.scrollTop||0;const s=states[r];old.innerHTML=`<div class="statusbar"><span>9:41</span><span>${icon('wifi')}${icon('battery-full')}</span></div><div class="nav">${btn('back',icon('arrow-left'),'back','aria-label="返回"')}<strong>赛事详情</strong><span class="capsule">${icon('ellipsis')}<i></i></span></div><div class="viewport"><div class="event-head"><div class="event-kicker"><span>2026 · 河南遂平</span>${status()}</div><h2>嵖岈山首届汽车<br>越野嘉年华</h2><div class="event-meta"><span>${icon('calendar-days')}08.23 — 08.30</span><span>${icon('map-pin')}嵖岈山风景区</span></div>${btn('announcement',`${icon('flag')}赛事公告 · 查看比赛安排${icon('chevron-right')}`,'announcement')}</div>${entry(r)}${nav(r)}<div class="content">${content(r)}</div></div><div class="footer-actions"><div class="social">${btn('like',icon('heart')+`<span>${s.likes}</span>`,'','aria-label="点赞"')}${btn('comment',icon('message-circle')+'<span>评论</span>')}${btn('share',icon('share-2')+'<span>分享</span>')}</div>${btn(r==='user'?'my':r==='staff'?'entry':r==='admin'?'review':'grant',r==='user'?'查看我的成绩':r==='staff'?(phase==='live'?'录入赛段成绩':'查看录入记录'):r==='admin'?'复核与发布':'分配本场权限','primary '+(r==='staff'?'blue':''))}</div>`;if(keep)old.querySelector('.viewport').scrollTop=scroll}
function content(r){switch(states[r].tab){case'registration':return registration();case'results':return results(r);case'work':return work(r);default:return intro()}}
function intro(){return `<section class="section"><div class="section-title"><h3>赛事介绍</h3>${btn('rules','完整规程 ›','text-btn')}</div><img class="poster" src="${POSTER}" alt="嵖岈山汽车越野嘉年华海报"><p class="intro-copy">走进嵖岈山，感受汽车运动与山野风光。活动包含汽车定向集结、场地越野及城市攀爬赛事。</p></section><section class="section"><div class="section-title"><h3>赛事信息</h3><span class="subtle">河南 · 驻马店</span></div><dl class="facts"><dt>比赛时间</dt><dd>2026.08.23 — 08.30</dd><dt>报名截止</dt><dd>2026.08.22</dd><dt>集合地点</dt><dd>遂平县 · 报到地点待定</dd><dt>赛事联系</dt><dd>马银鹏</dd></dl>${btn('contact','查看联系方式 '+icon('chevron-right'),'row row-btn')}</section><section class="section"><div class="section-title"><h3>赛段进度</h3><span class="subtle">模拟赛程</span></div><div class="stage-strip">${Array.from({length:9},(_,i)=>`<span class="${i<3?'done':i===3?'current':''}">${i+1}</span>`).join('')}</div><p class="subtle">SS1–SS3 已发布，后续赛段待更新。</p>${btn('results','打开成绩中心 '+icon('chevron-right'),'row row-btn')}</section>`}
function registration(){return `<section class="section"><div class="section-title"><h3>我的报名</h3><span class="tiny-tag">审核通过</span></div><div class="row"><div><strong>026 号车组 · 公开 A 组</strong><small>张晨 / 李航 · 演示车组</small></div>${icon('circle-check')}</div><p class="notice">报名已截止。比赛成绩将在审核发布后更新。</p>${btn('roster','查看报名名单 '+icon('chevron-right'),'row row-btn')}</section><section class="section"><div class="section-title"><h3>报名组别</h3><span class="subtle">原页面组别归入此处</span></div>${['集结赛公开A组','集结赛公开B组','集结赛公开C组','集结赛公开D组','场地赛专业组','场地赛公开组','场地赛UTV组','场地赛新秀组','场地赛女子组','攀爬赛改装组','攀爬赛量产组'].map((n,i)=>`<div class="registration-row"><div>${n}<small>报名已截止</small></div><span class="price">¥ 1 / ${i<4?'辆':'人'}</span></div>`).join('')}</section>`}
function results(r){const f=states[r].filter;return `<section class="section"><div class="section-title"><h3>成绩中心</h3><span class="tiny-tag">${phase==='live'?'阶段成绩':'已发布成绩'} · 已发布</span></div><div class="chips">${['总榜','赛段','我的成绩'].map(t=>btn('filter',t,f===t?'active':'',`data-filter="${t}"`)).join('')}</div>${f==='我的成绩'?ticket():f==='赛段'?`<div class="notice">按赛段查看成绩；未发布赛段显示“待发布”。</div><div class="chips">${['SS1','SS2','SS3','SS4 — SS9'].map((x,i)=>btn('stage',x,i===0?'active':'',`data-stage="${x}"`)).join('')}</div>`:`<div class="row" style="padding-top:0"><strong>公开 A 组</strong><span class="subtle">12 个车组 · 点击查看车组</span></div>`}${f==='我的成绩'?`<div class="section-title"><h3>赛段明细</h3><span class="subtle">时:分:秒.百分秒</span></div><table class="score-table"><thead><tr><th>赛段</th><th>用时</th><th>罚时</th><th>状态</th></tr></thead><tbody>${[['SS1','12:30.25'],['SS2','11:28.36'],['SS3','13:02.14']].map(a=>`<tr><td>${a[0]}</td><td class="num">${a[1]}</td><td class="num">00:00.00</td><td>已发布</td></tr>`).join('')}</tbody></table>`:scoreRows(f==='赛段')}<p class="subtle" style="margin-top:13px">成绩版本 v1 · 08月25日 14:30 发布<br>计入 SS1–SS3；示例成绩仅用于讨论界面。</p></section><section class="section">${btn('explain','计时与排名说明 '+icon('chevron-right'),'row row-btn')}${btn('appeal','对成绩有疑问？联系赛事管理员 '+icon('chevron-right'),'row row-btn')}</section>`}
function ticket(){return `<div class="score-ticket"><div class="ticket-top"><span class="big-bib">026</span><div class="crew">张晨 / 李航<small>公开 A 组 · 我的车组</small></div>${icon('flag')}</div><div class="ticket-data"><div><span class="ticket-label">已发布累计用时</span><div class="time">00:37:00.75</div></div><div class="rank">3<small> / 12</small><div class="ticket-label">组内排名</div></div></div></div>`}
function scoreRows(stage=false){return `<table class="score-table"><thead><tr><th>名次</th><th>车组</th><th>${stage?'SS1 用时':'累计用时'}</th></tr></thead><tbody>${[['1','008','王磊 / 陈立','36:28.42','12:10.14'],['2','015','周远 / 赵明','36:45.18','12:23.08'],['3','026','张晨 / 李航','37:00.75','12:30.25'],['4','032','林川 / 吴森','37:19.60','12:41.36'],['—','041','何林 / 方宇','DNF','DNF']].map(a=>`<tr class="${a[1]==='026'?'me':''}" data-action="crew"><td class="rank-medal">${a[0]}</td><td><strong>${a[1]}${a[1]==='026'?' · 我':''}</strong><small>${a[2]}</small></td><td class="num">${stage?a[4]:a[3]}</td></tr>`).join('')}</tbody></table>`}
function task(action,i,title,sub,count=''){return btn(action,`<span class="task-icon">${icon(i)}</span><span class="task-body"><strong>${title}</strong><small>${sub}</small></span><span class="count">${count}</span>${icon('chevron-right')}`,'task')}
function work(r){const s=states[r];if(r==='staff')return `<section class="section"><div class="section-title"><h3>我的现场任务</h3><span class="tag-outline">终点计时员</span></div><div class="notice ${phase==='ended'?'warn':''}">${phase==='live'?'授权 SS1 / SS2 · 08月25日 18:00 到期':'本场赛事已结束，录入已关闭。历史记录可查。'}</div><div class="stats"><div><b>${s.saved?'27':'26'}</b><small>已提交</small></div><div><b>${s.saved?'17':'18'}</b><small>待录入</small></div><div><b>0</b><small>退回修改</small></div></div>${task('entry','timer',phase==='live'?'终点计时录入':'查看计时记录','SS1 / SS2 · 车号检索')}${task('records','history','我的录入记录','查看时间与处理状态')}${task('staffscope','shield-check','当前权限','只显示本场获授权操作')}</section><section class="section"><div class="section-title"><h3>最近提交</h3><span class="subtle">等待复核</span></div>${['025','024','023'].map((n,i)=>`<div class="row"><div><strong>${n} 号车 · SS2</strong><small>14:${32-i}:00 提交</small></div><span class="tiny-tag">待复核</span></div>`).join('')}<p class="subtle" style="margin-top:12px">已发布成绩的修改需管理员处理。</p></section>`;
if(r==='owner')return `<section class="section"><div class="section-title"><h3>本场人员与权限</h3><span class="tag-outline">最高管理员</span></div><div class="notice">按人分配操作、赛段和有效期。授权到期后自动收回本场工作权限。</div>${[['陈立','赛事管理员','审核报名 · 复核与发布'],['王磊','终点计时员','SS1 / SS2 · 终点录入'],['李航','发车工作人员','SS1 · 发车时间录入']].map((a,i)=>`<button class="row row-btn" data-action="${i===1?'editgrant':'person'}"><div><strong>${a[0]} <span class="subtle">${a[1]}</span></strong><small>${a[2]}</small></div><span class="grant-state">${i===1&&s.revoked?'已收回':'已授权'}</span>${icon('chevron-right')}</button>`).join('')}${btn('grant',icon('plus')+' 添加赛事协作人员','primary full')}</section><section class="section"><div class="section-title"><h3>赛事管理</h3></div>${task('review','file-check','复核与发布','查看本场待处理成绩','2')}${task('audit','history','授权变更记录','查看谁在何时调整了权限')}${task('expiry','clock-3','赛后权限处理','到期回收，保留历史操作记录')}</section>`;
return `<section class="section"><div class="section-title"><h3>本场待办</h3><span class="tag-outline">赛事管理员</span></div><div class="stats"><div><b>0</b><small>报名待审</small></div><div><b>${s.reviewed?'0':'2'}</b><small>成绩待复核</small></div><div><b>${s.published?'0':'1'}</b><small>待发布</small></div></div>${task('review','file-check','成绩复核与发布',s.published?'SS2 v2 已发布':'SS2 · 发布前检查记录',s.published?'':'2')}${task('registrations','users','报名与车组','86 个演示报名车组')}${task('penalty','flag','罚时与异常','DNS / DNF / DSQ 记录')}${task('audit','history','成绩修改记录','操作人、修改原因和历史版本')}</section><section class="section"><div class="section-title"><h3>当前发布情况</h3><span class="tiny-tag">公开可见</span></div>${['SS1','SS2','SS3'].map(n=>`<div class="row"><strong>${n} 赛段成绩</strong><span class="subtle">${n==='SS2'&&s.published?'v2':'v1'} · 已发布</span></div>`).join('')}<p class="subtle" style="margin-top:12px">权限调整由最高管理员处理。</p></section>`}
function sheet(r,title,body){el(r).querySelector('.veil')?.remove();el(r).insertAdjacentHTML('beforeend',`<div class="veil"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><h3>${title}</h3>${btn('close',icon('x'),'','aria-label="关闭"')}</div>${body}</section></div>`);el(r).querySelector('.sheet-head button').focus()}
function toast(r,text){el(r).querySelector('.toast')?.remove();el(r).insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);setTimeout(()=>el(r)?.querySelector('.toast')?.remove(),2700)}
function changeTab(r,t){states[r].tab=t;render(r);el(r).querySelector('.tabs').scrollIntoView({block:'nearest'})}
function showEntry(r){if(r!=='staff')return;if(phase==='ended'){sheet(r,'我的录入记录','<p class="notice warn">本场已完赛，录入关闭。</p>'+recordBody());return}sheet(r,'录入终点时间',`<div class="notice">本场授权：SS1 / SS2 · 终点时间录入</div><label class="form-label">选择赛段</label><select class="form-input" id="entry-stage"><option>SS2</option><option>SS1</option></select><label class="form-label">车号</label><input class="form-input" id="bib" inputmode="numeric" value="026" maxlength="3"><div class="row"><strong>张晨 / 李航</strong><span class="subtle">公开 A 组</span></div><label class="form-label">终点时间 · 24 小时制</label><input class="form-input time-input" id="finish" value="14:23:18.36" aria-label="终点时间"><p class="subtle" style="margin-top:8px">发车 14:11:50.00 · 同日完赛</p><div class="error" id="entry-error"></div>${btn('save-entry','检查并提交','primary blue full')}<p class="subtle" style="margin-top:10px">提交后等待复核，不直接改变公开成绩。</p>`)}
function recordBody(){return '<p class="subtle">仅显示本人在本场赛事的录入记录。</p>'+['026','025','024'].map(n=>`<div class="row"><div><strong>${n} 号 · SS2</strong><small>终点 14:23:18.36</small></div><span class="tiny-tag">待复核</span></div>`).join('')}
function grant(r,edit=false){if(r!=='owner')return;sheet(r,edit?'调整王磊的本场权限':'添加赛事协作人员',`<div class="notice">授权范围：嵖岈山首届汽车越野嘉年华</div><label class="form-label">${edit?'工作人员':'已验证手机号（演示值）'}</label><input id="grant-phone" class="form-input" value="${edit?'王磊 · 138****0026':'13800000026'}" ${edit?'readonly':''}><label class="form-label">操作权限</label><label class="check-line"><input id="grant-finish" type="checkbox" checked>录入终点时间</label><label class="check-line"><input type="checkbox">录入发车时间</label><label class="check-line"><input type="checkbox">修改尚未复核的本人记录</label><details class="permission-options"><summary>更多管理权限</summary><label class="check-line"><input type="checkbox">报名审核</label><label class="check-line"><input type="checkbox">成绩复核与发布</label><label class="check-line"><input type="checkbox">罚时与异常处理</label></details><label class="form-label">赛段范围</label><div class="chips">${['SS1','SS2','SS3'].map((n,i)=>`<label class="check-line"><input type="checkbox" class="grant-stage" value="${n}" ${i<2?'checked':''}>${n}</label>`).join('')}</div><label class="form-label">授权有效期</label><div class="two-col"><label><span class="subtle">开始</span><input aria-label="开始时间" class="form-input" type="datetime-local" value="2026-08-25T08:00"></label><label><span class="subtle">结束</span><input aria-label="结束时间" class="form-input" type="datetime-local" value="2026-08-25T18:00"></label></div><p class="subtle" style="margin-top:8px">沿用赛事演示时间；到期后自动失去本场工作权限。</p><div id="grant-error" class="error"></div>${btn('save-grant','保存本场授权','primary full')}${edit?btn('revoke','立即收回本场权限','secondary danger full','style="width:100%;margin-top:9px"'):''}`)}
function review(r){if(!['admin','owner'].includes(r))return;let s=states[r];sheet(r,'成绩复核与发布',`<div class="notice">SS2 · 公开 A 组 · ${s.published?'v2 已发布':'待发布 v2'}</div><div class="row"><div><strong>026 号车组</strong><small>终点时间 · 王磊录入</small></div><span class="value">14:23:18.36</span></div><div class="row"><div><strong>027 号车组</strong><small>终点时间 · 王磊录入</small></div><span class="value">14:24:05.10</span></div><label class="check-line"><input id="review-check" type="checkbox" ${s.reviewed?'checked':''}>已核对时间、车号及异常状态</label><p class="subtle">发布后，参赛车组和观众可看到本版本成绩。</p><div class="error" id="review-error"></div>${btn('publish',s.published?'查看已发布成绩':'确认复核并发布','primary full')}`)}
document.getElementById('board').innerHTML=Object.entries(roles).map(([r,[title,sub]])=>`<article class="role-column" data-role="${r}"><div class="role-caption"><strong>${title}</strong><span>${sub}</span></div><div class="phone" id="phone-${r}"></div></article>`).join('');Object.keys(roles).forEach(r=>render(r));
$('#phase').addEventListener('change',e=>{phase=e.target.value;Object.keys(roles).forEach(r=>render(r))});$('#focus').addEventListener('change',e=>{const v=e.target.value;$('#board').classList.toggle('focused',v!=='all');document.querySelectorAll('.role-column').forEach(c=>c.classList.toggle('hide',v!=='all'&&c.dataset.role!==v))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.veil').forEach(v=>v.remove())});
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const col=target.closest('[data-role]');if(!col)return;const r=col.dataset.role,a=target.dataset.action,s=states[r];
if(a==='close'){el(r).querySelector('.veil')?.remove();return}if(a==='tab'){changeTab(r,target.dataset.tab);return}if(a==='my'){s.filter='我的成绩';changeTab(r,'results');return}if(a==='results'||a==='work'){changeTab(r,a);return}if(a==='filter'){s.filter=target.dataset.filter;render(r,true);return}if(a==='entry'){showEntry(r);return}if(a==='grant'||a==='editgrant'){grant(r,a==='editgrant');return}if(a==='review'){review(r);return}
if(a==='save-entry'){const bib=el(r).querySelector('#bib').value.trim(),time=el(r).querySelector('#finish').value;if(bib!=='026'){el(r).querySelector('#entry-error').textContent='此原型仅配置 026 号演示车组，请输入 026。';return}if(!/^([01]\d|2[0-3]):[0-5]\d:[0-5]\d\.\d{2}$/.test(time)){el(r).querySelector('#entry-error').textContent='请输入完整时间，例如 14:23:18.36。';return}sheet(r,'确认本次录入',`<p class="notice">026 号车组 · ${el(r).querySelector('#entry-stage').value}</p><p class="details-text">终点时间</p><p class="big-car">${time}</p><p class="subtle">确认无误后提交给管理员复核。</p>${btn('confirm-entry','确认提交','primary blue full')}`);return}
if(a==='confirm-entry'){s.saved=true;render(r,true);toast(r,'已模拟提交，等待管理员复核');return}
if(a==='save-grant'){const fields=el(r).querySelectorAll('input[type="datetime-local"]');if(!el(r).querySelector('.grant-stage:checked')||fields[0].value>=fields[1].value){el(r).querySelector('#grant-error').textContent='请选择赛段，且结束时间必须晚于开始时间。';return}s.revoked=false;render(r,true);toast(r,'本场授权已模拟保存，按设定时间到期');return}
if(a==='revoke'){sheet(r,'收回本场权限','<p class="details-text">王磊将失去本场工作权限。个人账户和历史录入记录保留。</p>'+btn('confirm-revoke','确认收回','primary full'));return}if(a==='confirm-revoke'){s.revoked=true;render(r,true);toast(r,'已模拟收回王磊的本场权限');return}
if(a==='publish'){if(s.published){s.filter='总榜';changeTab(r,'results');return}if(!el(r).querySelector('#review-check').checked){el(r).querySelector('#review-error').textContent='请先核对成绩并勾选确认。';return}s.reviewed=true;s.published=true;render(r,true);toast(r,'SS2 成绩 v2 已模拟发布');return}
if(a==='like'){s.likes=s.likes?0:1;render(r,true);return}if(a==='records'){sheet(r,'我的录入记录',recordBody());return}
const info={back:['返回赛事列表','这里是赛事详情设计预览，实际小程序返回赛事列表。'],announcement:['赛事公告','比赛安排、检录时间、临时调整集中在这里查看。公告内容沿用真实赛事资料；本稿只演示入口与阅读布局。'],rules:['完整赛事规程','原详情页的前言、各项规则、赛程、报名条件和对应图片按章节放在此处阅读，不需要在报名与成绩之间反复长距离滚动。'],contact:['赛事联系方式','联系人：马银鹏<br>联系电话：13269191919<br>微信号：13269191919<br><br>真实小程序中手机号可直接拨打。'],explain:['计时与排名说明','赛段用时 = 终点时间 − 发车时间 + 罚时。累计成绩按赛事规则计算；DNS、DNF、DSQ 单独标识。具体排序与同分规则以本场规程为准。'],appeal:['成绩疑问','提交车号、赛段和问题说明，由赛事管理员核对。已发布成绩修订保留原因与版本记录。'],staffscope:['本场授权范围','可录入 SS1 / SS2 的终点时间。不可录入 SS3，不可处理罚时、复核成绩或分配人员权限。授权到期后回收。'],audit:['变更记录','08月25日 08:00 · 最高管理员<br>为王磊授予 SS1 / SS2 终点录入权限。<br><br>每次变更记录操作人、时间、变更前后内容与原因。'],expiry:['赛后权限处理','任务到期自动回收工作权限。临时撤回立即生效，个人成绩与历史操作记录继续保留。'],penalty:['罚时与异常','按车号及赛段登记罚时、DNS、DNF、DSQ，填写依据与原因，复核后再更新公开成绩。'],person:['本场协作人员','只有最高管理员可调整其本场操作范围及有效期。角色名称仅是模板，最终按实际授权显示入口。'],crew:['车组成绩','点击车组打开赛段用时、罚时、累计成绩及发布版本；“我的成绩”可直接定位本人车组。'],comment:['赛事评论','评论列表和输入区在底部面板内展示，关闭后回到原来的阅读位置。当前没有演示评论。'],share:['分享赛事','分享给微信好友 / 生成赛事分享卡。此 HTML 仅展示布局；真实微信分享能力在小程序中接入，不因点击按钮增加分享成功计数。']};
if(a==='stage'){toast(r,target.dataset.stage.includes('SS4')?'SS4–SS9 暂未发布':'原型当前展示 SS1 样例，其他赛段沿用相同布局');return}if(a==='roster'||a==='registrations'){sheet(r,'报名车组',scoreRows()+`<p class="subtle" style="margin-top:15px">演示名单。报名审核入口仅向获授权人员开放。</p>`);return}if(info[a])sheet(r,info[a][0],`<p class="details-text">${info[a][1]}</p>`);
});
</script></body></html>
